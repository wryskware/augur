[package]
name = "augur-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Ask your terminal a question; get an answer or a runnable command."
license = "MIT"
repository = "https://github.com/wryskware/augur"
readme = "README.md"
keywords = ["cli", "llm", "shell", "assistant"]
categories = ["command-line-utilities"]

[[bin]]
name = "ask"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
arboard = { version = "3.6.1", default-features = false }
clap = { version = "4.6.6", features = ["derive", "wrap_help"] }
clap_complete = "4.6.9"
dirs = "6.0.0"
inquire = "0.9.4"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
shell-words = "1.1.1"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tempfile = "3.27.0"
termimad = "0.35.1"
toml = "1"
toml_edit = "0.25.13"
which = "8.0.5"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
